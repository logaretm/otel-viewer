name: Publish CLI

on:
  push:
    branches: [main]
    # Changesets are what this workflow reacts to: a feature PR adding one, or
    # the release PR removing them all. Both touch .changeset/. A cli/ or
    # shared/ change without a changeset is deliberately not a release; the
    # changeset PR check enforces that the omission was deliberate.
    paths:
      - '.changeset/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'release: refresh the release PR. snapshot: throwaway build off this branch.'
        type: choice
        default: release
        options: [release, snapshot]
      bump:
        description: 'release mode: open a release PR even with no pending changesets, using this bump'
        type: choice
        default: none
        options: [none, patch, minor, major]
      tag:
        description: 'snapshot mode: npm dist-tag to publish under'
        default: next

permissions:
  contents: write # push the release branch + tag
  pull-requests: write # open and update the release PR
  id-token: write # npm trusted publishing (OIDC)

# Releases serialize; snapshots run on their own track so a snapshot dispatch
# can never cancel a queued release.
concurrency:
  group: publish-cli-${{ inputs.mode || 'release' }}
  cancel-in-progress: false

# Snapshots live in this file rather than their own workflow because npm pins
# trusted publishing to a single repo + workflow filename.

jobs:
  # Accumulates pending changesets into a "chore(cli): release" PR carrying the
  # version bump and the CHANGELOG entry. Merging that PR is the act of
  # releasing; this job never publishes anything itself.
  version:
    if: github.event_name == 'push' || inputs.mode == 'release'
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-release

      # Escape hatch for releasing something that merged without a changeset.
      - name: Synthesize a changeset for a forced release
        if: inputs.bump != '' && inputs.bump != 'none'
        run: |
          cat > .changeset/forced-release.md <<EOF
          ---
          'teley-cli': ${{ inputs.bump }}
          ---

          Manual release dispatched from the Actions tab.
          EOF

      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm exec changeset version
          pr-title: 'chore(cli): release'
          commit-message: 'chore(cli): version packages'
        env:
          # Also read by @changesets/changelog-github to resolve PRs and authors.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Reached when main has no changesets left, which is the state the release PR
  # merge produces. Publishing what is already committed means npm, the git tag,
  # and the GitHub release all describe the exact commit that was reviewed.
  publish:
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    # TELEY_CLI_SENTRY_DSN lives here, and environment secrets are only handed
    # to jobs that ask for the environment by name.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-release

      # Most runs land here with nothing to do (any push that only touched
      # .changeset/ without changing the version), so this is a no-op, not a
      # failure. It doubles as recovery: a run that failed after versioning but
      # before publishing is fixed by re-running this job.
      - name: Check the registry
        id: check
        run: |
          version=$(node -p "require('./cli/package.json').version")

          if npm view "teley-cli@$version" version >/dev/null 2>&1; then
            echo "teley-cli@$version is already published; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      # Build before publishing so a broken bundle fails the run without having
      # tagged anything.
      - name: Build bundle
        if: steps.check.outputs.publish == 'true'
        working-directory: cli
        env:
          TELEY_CLI_SENTRY_DSN: ${{ secrets.TELEY_CLI_SENTRY_DSN }}
        # A release that silently ships without the DSN reports nothing, which
        # is invisible until we go looking for a crash that was never sent.
        run: |
          if [ -z "$TELEY_CLI_SENTRY_DSN" ]; then
            echo "::error::TELEY_CLI_SENTRY_DSN is not set; the published binary would report nothing"
            exit 1
          fi
          bun run build

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        working-directory: cli
        # prepublishOnly rebuilds inside npm publish, so it needs the DSN too or
        # it overwrites the bundle built above with an inert one.
        env:
          TELEY_CLI_SENTRY_DSN: ${{ secrets.TELEY_CLI_SENTRY_DSN }}
        run: npm publish --access public

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "cli-v${{ steps.check.outputs.version }}"
          git push origin "cli-v${{ steps.check.outputs.version }}"

      # Release notes are the CHANGELOG section the release PR carried, so what
      # npm ships, what the changelog says, and what GitHub shows all come from
      # the same changesets. Runs here rather than in an on:push:tags workflow
      # because the tag above is pushed with GITHUB_TOKEN, and GitHub does not
      # fire new workflows for those pushes.
      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Everything between the first `## ` heading and the next one.
          awk '/^## /{ n++ } n == 1' cli/CHANGELOG.md | tail -n +2 > /tmp/notes.md
          gh release create "cli-v${{ steps.check.outputs.version }}" \
            --title "teley-cli v${{ steps.check.outputs.version }}" \
            --notes-file /tmp/notes.md

  # Publishes the current branch as e.g. 0.2.0-next-20260814120000 under a
  # dist-tag, so a CLI change can be tried with `bunx teley-cli@next` before it
  # is released. Versions nothing in git: no commit, no tag, no changesets
  # consumed. Needs at least one pending changeset to have a version to build
  # from.
  snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-release

      - name: Version as a snapshot
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec changeset version --snapshot "${{ inputs.tag }}"
          version=$(node -p "require('./cli/package.json').version")

          case "$version" in
            *-"${{ inputs.tag }}"-*) ;;
            *)
              echo "::error::No pending changesets, so there is nothing to snapshot."
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version under dist-tag ${{ inputs.tag }}"

      - name: Build bundle
        working-directory: cli
        env:
          TELEY_CLI_SENTRY_DSN: ${{ secrets.TELEY_CLI_SENTRY_DSN }}
        # A snapshot is a throwaway dist-tag, so a missing secret warns rather
        # than failing the run the way a real release does.
        run: |
          if [ -z "$TELEY_CLI_SENTRY_DSN" ]; then
            echo "::warning::TELEY_CLI_SENTRY_DSN is not set; this snapshot will report nothing"
          fi
          bun run build

      # --tag keeps this off `latest`, so plain `bunx teley-cli` is unaffected.
      - name: Publish to npm
        working-directory: cli
        # prepublishOnly rebuilds here too.
        env:
          TELEY_CLI_SENTRY_DSN: ${{ secrets.TELEY_CLI_SENTRY_DSN }}
        run: npm publish --access public --tag "${{ inputs.tag }}"

      - name: Summary
        run: |
          echo "Try it with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo "bunx teley-cli@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
