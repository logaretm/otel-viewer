name = "teley"
main = "src/index.ts"
compatibility_date = "2026-02-07"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [{ name = "TELEMETRY_ROOM", class_name = "TelemetryRoom" }]

# Sentry reads SENTRY_DSN / SENTRY_ENVIRONMENT off the env binding. Set the DSN
# with `wrangler secret put SENTRY_DSN` (or as a plain var) so it stays out of
# the repo; leaving it unset disables the SDK, which is what `wrangler dev` does.
[vars]
SENTRY_ENVIRONMENT = "production"

# Gives Sentry a release to attribute events to, per deployed version.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_classes = ["TelemetryRoom"]

[[migrations]]
tag = "v2"
new_classes = ["SharedTrace"]

[[migrations]]
tag = "v3"
deleted_classes = ["SharedTrace"]

# Serve static assets (run `pnpm build` first to generate .output/public)
[assets]
binding = "ASSETS"
directory = "../web/.output/public"
not_found_handling = "single-page-application"
html_handling = "none"
# Ensure Worker runs first for API/WebSocket routes (not just navigation requests)
run_worker_first = ["/api/*", "/r/*"]

# Development settings
[dev]
port = 8787
